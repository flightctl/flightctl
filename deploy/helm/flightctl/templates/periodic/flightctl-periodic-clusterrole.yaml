{{ if .Values.periodic.clusterLevelSecretAccess }}
{{- if eq (include "flightctl.isNamespaceScoped" .) "true" }}
{{- fail "periodic.clusterLevelSecretAccess requires cluster-admin permissions and cannot be enabled when global.namespaceScoped=true" }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "flightctl.standardLabels" . | nindent 4 }}
    flightctl.service: flightctl-periodic
  name: flightctl-periodic-{{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list", "watch"]
{{ end }}
