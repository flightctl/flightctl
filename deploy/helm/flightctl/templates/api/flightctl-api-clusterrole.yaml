{{- $namespaceScoped := eq (include "flightctl.isNamespaceScoped" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ if $namespaceScoped }}Role{{ else }}ClusterRole{{ end }}
metadata:
  labels:
    {{- include "flightctl.standardLabels" . | nindent 4 }}
    flightctl.service: flightctl-api
  name: flightctl-api-{{ .Release.Namespace }}
  {{- if $namespaceScoped }}
  namespace: {{ include "flightctl.rbacNamespace" . }}
  {{- end }}
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list"]
