{{- /* Determine whether to render the pre-upgrade scale job */ -}}
{{- $allDeployments := default (list) .Values.upgradeHooks.scaleDown.deployments -}}
{{- $condition := default "chart" .Values.upgradeHooks.scaleDown.condition -}}
{{- $deploymentsToScale := list -}}

{{- if gt (len $allDeployments) 0 -}}
  {{- if eq $condition "always" -}}
    {{- $deploymentsToScale = $allDeployments -}}
  {{- else if eq $condition "never" -}}
    {{- /* leave empty */ -}}
  {{- else -}}
    {{- /* Default: "chart" — scale only when helm.sh/chart changed */ -}}
    {{- $ns := default .Release.Namespace .Values.global.internalNamespace -}}
    {{- $currentChart := printf "%s-%s" .Chart.Name (.Chart.Version | replace "+" "_") -}}
    {{- range $d := $allDeployments -}}
      {{- $depObj := lookup "apps/v1" "Deployment" $ns $d -}}
      {{- $existingChart := dig "metadata" "labels" "helm.sh/chart" "" $depObj -}}
      {{- if ne $existingChart $currentChart -}}
        {{- $deploymentsToScale = append $deploymentsToScale $d -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
{{- end -}}

{{- $deploymentsToScale = concat $deploymentsToScale (list "flightctl-api" "flightctl-imagebuilder-worker") | uniq -}}
{{- $internalNamespace := default .Release.Namespace .Values.global.internalNamespace -}}
{{- $externalNamespace := .Release.Namespace -}}

{{- if gt (len $deploymentsToScale) 0 }}
---
# ServiceAccount and RBAC for pre-upgrade scaling
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flightctl-upgrade
  namespace: {{ default .Release.Namespace .Values.global.internalNamespace }}
  labels:
    {{- include "flightctl.standardLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-25"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded

{{ range $namespace := (list $internalNamespace $externalNamespace | uniq) }}
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: flightctl-upgrade
  namespace: {{ $namespace }}
  labels:
    {{- include "flightctl.standardLabels" $ | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-24"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: flightctl-upgrade
  namespace: {{ $namespace }}
  labels:
    {{- include "flightctl.standardLabels" $ | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-23"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: flightctl-upgrade
    namespace: {{ $internalNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flightctl-upgrade
{{ end }}

---
apiVersion: batch/v1
kind: Job
metadata:
  name: flightctl-preupgrade-scale-to-zero
  namespace: {{ default .Release.Namespace .Values.global.internalNamespace }}
  labels:
    {{- include "flightctl.standardLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        flightctl.service: flightctl-preupgrade
        {{- include "flightctl.standardLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: flightctl-upgrade
      {{- if .Values.global.imagePullSecretName }}
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecretName }}
      {{- end }}
      containers:
        - name: scaler
          image: {{ .Values.clusterCli.image.image }}:{{ .Values.clusterCli.image.tag }}
          imagePullPolicy: {{ default .Values.global.imagePullPolicy .Values.clusterCli.image.pullPolicy }}
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              TIMEOUT={{ default 120 .Values.upgradeHooks.scaleDown.timeoutSeconds }}
              echo "Pre-upgrade scale to zero started (timeout=${TIMEOUT}s)"
              DEPLOYMENTS="{{- range $idx, $d := $deploymentsToScale -}}{{ if $idx }} {{ end }}{{ if has $d (list "flightctl-api" "flightctl-imagebuilder-api" "flightctl-alertmanager-proxy") }}{{ $externalNamespace }}{{ else }}{{ $internalNamespace }}{{ end }}/{{ $d }}{{- end }}"
              for target in ${DEPLOYMENTS}; do
                NAMESPACE=${target%/*}
                dep=${target#*/}
                existing=$(oc get deployment/${dep} -n "${NAMESPACE}" --ignore-not-found -o name)
                if [ -z "${existing}" ]; then
                  continue
                fi
                echo "Scaling ${dep} to 0 replicas..."
                oc scale deployment/${dep} -n "${NAMESPACE}" --replicas=0
                echo "Waiting for ${dep} to scale down..."
                oc rollout status deployment/${dep} -n "${NAMESPACE}" --watch=true --timeout="${TIMEOUT}s"
                oc wait --for=delete pod -l "flightctl.service=${dep}" -n "${NAMESPACE}" --timeout="${TIMEOUT}s"
              done
              echo "Scale-to-zero steps finished."
{{- end }}
