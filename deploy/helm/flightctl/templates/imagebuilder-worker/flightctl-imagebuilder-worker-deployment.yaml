{{- if and .Values.imageBuilderWorker .Values.imageBuilderWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    flightctl.service: flightctl-imagebuilder-worker
    {{- include "flightctl.standardLabels" . | nindent 4 }}
  name: flightctl-imagebuilder-worker
  namespace: {{ default .Release.Namespace .Values.global.internalNamespace }}
spec:
  replicas: {{ default 1 .Values.imageBuilderWorker.replicas }}
  selector:
    matchLabels:
      flightctl.service: flightctl-imagebuilder-worker
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        flightctl.service: flightctl-imagebuilder-worker
        {{- include "flightctl.standardLabels" . | nindent 8 }}
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      serviceAccountName: flightctl-imagebuilder-worker
      securityContext:
        runAsNonRoot: true
        {{- if ne (include "flightctl.enableOpenShiftExtensions" .) "true" }}
        runAsUser: 1000
        fsGroup: 1000
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.global.imagePullSecretName }}
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecretName }}
      {{- end }}
      {{- $databaseWait := include "flightctl.databaseWaitInitContainer" (dict "context" . "userType" "app") | fromYamlArray }}
      {{- $migrationWait := include "flightctl.migrationWaitInitContainer" (dict "context" . "timeout" 600) | fromYamlArray }}
      {{- $waitContainers := concat $databaseWait $migrationWait }}
      {{- range $container := $waitContainers }}
      {{- $_ := set $container "securityContext" ((include "flightctl.imageBuilderRestrictedSecurityContext" $ | fromYaml).securityContext) }}
      {{- $_ := set $container "env" (append ($container.env | default list) (dict "name" "HOME" "value" "/tmp")) }}
      {{- $_ := set $container "volumeMounts" (append ($container.volumeMounts | default list) (dict "name" "worker-scratch" "mountPath" "/tmp")) }}
      {{- end }}
      initContainers:
        {{- toYaml $waitContainers | nindent 8 }}
      containers:
        - name: flightctl-imagebuilder-worker
          image: {{ include "flightctl.ensureOsQualifiedImage" (dict "root" . "imageName" .Values.imageBuilderWorker.image.image) }}:{{ default .Chart.AppVersion .Values.imageBuilderWorker.image.tag }}
          imagePullPolicy: {{ default .Values.global.imagePullPolicy .Values.imageBuilderWorker.image.pullPolicy }}
          env:
            - name: HOME
              value: "/var/lib/flightctl"
            - name: TMPDIR
              value: "/tmp"
            - name: KV_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default "flightctl-kv-secret" .Values.kv.passwordSecretName }}
                  key: password
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "flightctl.dbAppUserSecret" . }}
                  key: userPassword
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "flightctl.dbAppUserSecret" . }}
                  key: user
            {{- $vuln := default dict .Values.vulnerabilityReporting -}}
            {{- $trustify := default dict $vuln.trustify -}}
            {{- $auth := default dict $trustify.auth -}}
            {{- if and (default false $vuln.enabled) $trustify (eq $auth.mode "client-credentials") $auth.secretName }}
            - name: FLIGHTCTL_VULNERABILITY_REPORTING_TRUSTIFY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $auth.secretName }}
                  key: client_id
            - name: FLIGHTCTL_VULNERABILITY_REPORTING_TRUSTIFY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $auth.secretName }}
                  key: client_secret
            {{- end }}
          volumeMounts:
            - mountPath: /var/lib/flightctl/.flightctl/config.yaml
              name: flightctl-imagebuilder-worker-config
              subPath: config.yaml
              readOnly: true
            - mountPath: /var/lib/flightctl/.flightctl/certs/client-signer.crt
              name: flightctl-client-signer
              subPath: tls.crt
              readOnly: true
            - mountPath: /var/lib/flightctl/.flightctl/certs/client-signer.key
              name: flightctl-client-signer
              subPath: tls.key
              readOnly: true
            - mountPath: /var/lib/flightctl/.flightctl/certs/ca-bundle.crt
              name: flightctl-ca-bundle
              subPath: ca-bundle.crt
              readOnly: true
            - mountPath: /var/lib/flightctl/.flightctl/encryption
              name: flightctl-encryption-key
              readOnly: true
            - mountPath: /var/lib/flightctl
              name: worker-home
            - mountPath: /tmp
              name: worker-scratch
            {{- if .Values.imageBuilderWorker.entitlementCertsSecretName }}
            - mountPath: /etc/pki/entitlement
              name: entitlement-certs
              readOnly: true
            {{- end }}
            {{- if .Values.imageBuilderWorker.yumReposSecretName }}
            - mountPath: /etc/yum.repos.d
              name: yum-repos
              readOnly: true
            {{- end }}
            {{- if .Values.imageBuilderWorker.rhsmSecretName }}
            - mountPath: /etc/rhsm
              name: rhsm
              readOnly: true
            {{- end }}
            {{- if .Values.imageBuilderWorker.rhsmCaSecretName }}
            - mountPath: /etc/rhsm/ca
              name: rhsm-ca
              readOnly: true
            {{- end }}
            {{- if .Values.imageBuilderWorker.serviceImages.pullSecretName }}
            - mountPath: /var/lib/flightctl/.config/containers/auth.json
              name: service-images-pull-secret
              subPath: auth.json
              readOnly: true
            {{- end }}

            {{- include "flightctl.dbSslVolumeMounts" . | nindent 12 }}
            {{- include "flightctl.vulnerabilityTrustifyCaVolumeMounts" . | nindent 12 }}
          {{- $worker := .Values.imageBuilderWorker }}
          {{- $concurrency := int $worker.maxConcurrentBuilds }}
          {{- $cpu := mul $concurrency (int $worker.vm.cpus) | toString }}
          {{- $memory := printf "%dMi" (add (mul $concurrency (int $worker.vm.memoryMiB)) 1024) }}
          {{- $resources := deepCopy ($worker.resources | default dict) }}
          {{- $requests := merge ($resources.requests | default dict) (dict "cpu" $cpu "memory" $memory) }}
          {{- $limits := merge ($resources.limits | default dict) (dict "cpu" $cpu "memory" $memory) }}
          {{- if eq $worker.vm.accelerator "kvm" }}
          {{- $_ := set $requests $worker.vm.kvmResourceName $concurrency }}
          {{- $_ := set $limits $worker.vm.kvmResourceName $concurrency }}
          {{- end }}
          resources:
            requests:
              {{- toYaml $requests | nindent 14 }}
            limits:
              {{- toYaml $limits | nindent 14 }}
          terminationMessagePath: /tmp/termination-log
          {{- include "flightctl.imageBuilderRestrictedSecurityContext" . | nindent 10 }}

      restartPolicy: Always
      volumes:
        - name: flightctl-imagebuilder-worker-config
          configMap:
            name: flightctl-imagebuilder-worker-config
        - name: flightctl-client-signer
          secret:
            secretName: flightctl-client-signer-ca
            defaultMode: 0440
        - name: flightctl-ca-bundle
          secret:
            secretName: flightctl-ca-bundle
        - name: flightctl-encryption-key
          secret:
            secretName: flightctl-encryption-key
            defaultMode: 0440
        - name: worker-home
          emptyDir: {}
        - name: worker-scratch
          emptyDir:
            sizeLimit: {{ .Values.imageBuilderWorker.vm.scratchSizeLimit }}
        {{- if .Values.imageBuilderWorker.entitlementCertsSecretName }}
        - name: entitlement-certs
          secret:
            secretName: {{ .Values.imageBuilderWorker.entitlementCertsSecretName }}
        {{- end }}
        {{- if .Values.imageBuilderWorker.yumReposSecretName }}
        - name: yum-repos
          secret:
            secretName: {{ .Values.imageBuilderWorker.yumReposSecretName }}
        {{- end }}
        {{- if .Values.imageBuilderWorker.rhsmSecretName }}
        - name: rhsm
          secret:
            secretName: {{ .Values.imageBuilderWorker.rhsmSecretName }}
        {{- end }}
        {{- if .Values.imageBuilderWorker.rhsmCaSecretName }}
        - name: rhsm-ca
          secret:
            secretName: {{ .Values.imageBuilderWorker.rhsmCaSecretName }}
        {{- end }}
        {{- if .Values.imageBuilderWorker.serviceImages.pullSecretName }}
        - name: service-images-pull-secret
          secret:
            secretName: {{ .Values.imageBuilderWorker.serviceImages.pullSecretName }}
            defaultMode: 0440
        {{- end }}
        {{- include "flightctl.dbSslVolumes" . | nindent 8 }}
        {{- include "flightctl.vulnerabilityTrustifyCaVolumes" . | nindent 8 }}
{{- end }}
