apiVersion: v1
kind: ConfigMap
metadata:
  name: flightctl-delta-worker-config
  namespace: {{ default .Release.Namespace .Values.global.internalNamespace }}
  labels:
    {{- include "flightctl.standardLabels" . | nindent 4 }}
    flightctl.service: flightctl-delta-worker
data:
  config.yaml: |-
    database:
        hostname: {{ include "flightctl.dbHostname" . }}
        type: "pgsql"
        port: {{ include "flightctl.dbPort" . | int }}
        name: {{ .Values.db.name }}
        {{- if eq .Values.db.type "external" }}
        {{- if .Values.db.external.sslmode }}
        sslmode: {{ .Values.db.external.sslmode | quote }}
        {{- end }}
        {{- if .Values.db.external.tlsConfigMapName }}
        sslrootcert: /etc/ssl/postgres/ca-cert.pem
        {{- end }}
        {{- if .Values.db.external.tlsSecretName }}
        sslkey: /etc/ssl/postgres/client-key.pem
        sslcert: /etc/ssl/postgres/client-cert.pem
        {{- end }}
        {{- end }}
    service: {}
    kv:
        hostname: flightctl-kv.{{ default .Release.Namespace .Values.global.internalNamespace }}.svc.cluster.local
        port: 6379
    metrics:
        enabled: true
        address: ":8080"
        systemCollector:
            enabled: true
            tickerInterval: 5s
        workerCollector:
            enabled: true
    {{- $delta := default dict .Values.deltaGeneration }}
    {{- $defaultRepo := default dict $delta.defaultRepository }}
    deltaGeneration:
        maxConcurrentDeltaGenerations: {{ default 2 $delta.maxConcurrentDeltaGenerations }}
        timeout: {{ default "30m" $delta.timeout }}
        {{- if $defaultRepo.registry }}
        defaultRepository:
            registry: {{ $defaultRepo.registry | quote }}
            {{- if $defaultRepo.repository }}
            repository: {{ $defaultRepo.repository | quote }}
            {{- end }}
            {{- if $defaultRepo.namespace }}
            namespace: {{ $defaultRepo.namespace | quote }}
            {{- end }}
            {{- if $defaultRepo.scheme }}
            scheme: {{ $defaultRepo.scheme | quote }}
            {{- end }}
            {{- if $defaultRepo.skipServerVerification }}
            skipServerVerification: true
            {{- end }}
        {{- end }}
    {{ if (default dict .Values.dev).tracing }}
    tracing:
        enabled: true
        endpoint: {{ .Values.dev.tracing.endpoint }}
        insecure: {{ .Values.dev.tracing.insecure }}
    {{ end }}
{{ include "flightctl.profiling" . | nindent 4 }}
{{- include "flightctl.encryptionConfig" . | nindent 4 }}
