apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    flightctl.service: flightctl-delta-worker
    {{- include "flightctl.standardLabels" . | nindent 4 }}
  name: flightctl-delta-worker
  namespace: {{ default .Release.Namespace .Values.global.internalNamespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      flightctl.service: flightctl-delta-worker
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        flightctl.service: flightctl-delta-worker
        {{- include "flightctl.standardLabels" . | nindent 8 }}
    spec:
      serviceAccountName: flightctl-delta-worker
      {{- if .Values.global.imagePullSecretName }}
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecretName }}
      {{- end }}
      initContainers:
      {{- include "flightctl.databaseWaitInitContainer" (dict "context" . "userType" "app") | nindent 6 }}
      {{- include "flightctl.migrationWaitInitContainer" (dict "context" . "timeout" 600) | nindent 6 }}
      containers:
        - name: flightctl-delta-worker
          image: {{ include "flightctl.ensureOsQualifiedImage" (dict "root" . "imageName" .Values.deltaWorker.image.image) }}:{{ default .Chart.AppVersion .Values.deltaWorker.image.tag }}
          imagePullPolicy: {{ default .Values.global.imagePullPolicy .Values.deltaWorker.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: metrics
              protocol: TCP
          env:
            - name: HOME
              value: "/root"
            - name: KV_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default "flightctl-kv-secret" .Values.kv.passwordSecretName }}
                  key: password
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "flightctl.dbAppUserSecret" . }}
                  key: userPassword
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "flightctl.dbAppUserSecret" . }}
                  key: user
            {{- $delta := default dict .Values.deltaGeneration -}}
            {{- $defaultRepo := default dict $delta.defaultRepository -}}
            {{- if $defaultRepo.secretName }}
            - name: DELTA_GENERATION_DEFAULT_REPOSITORY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $defaultRepo.secretName }}
                  key: username
            - name: DELTA_GENERATION_DEFAULT_REPOSITORY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $defaultRepo.secretName }}
                  key: password
            {{- end }}
            {{- if .Values.deltaWorker.env }}
            {{- range $key, $value := .Values.deltaWorker.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - mountPath: /root/.flightctl/config.yaml
              name: flightctl-delta-worker-config
              subPath: config.yaml
              readOnly: true
            - mountPath: /root/.flightctl/encryption
              name: flightctl-encryption-key
              readOnly: true
            {{- include "flightctl.dbSslVolumeMounts" . | nindent 12 }}
      restartPolicy: Always
      volumes:
        - name: flightctl-delta-worker-config
          configMap:
            name: flightctl-delta-worker-config
        - name: flightctl-encryption-key
          secret:
            secretName: flightctl-encryption-key
            defaultMode: 0400
        {{- include "flightctl.dbSslVolumes" . | nindent 8 }}
