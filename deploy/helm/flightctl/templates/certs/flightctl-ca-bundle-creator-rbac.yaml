{{- $certMethod := include "flightctl.getCertificateGenerationMethod" . }}
{{- if eq $certMethod "cert-manager" }}
---
# ServiceAccount for the cert-manager CA bundle creator Job
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flightctl-ca-bundle-creator
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "flightctl.standardLabels" . | nindent 4 }}

---
# Role with minimal permissions for CA bundle creation
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flightctl-ca-bundle-creator
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "flightctl.standardLabels" . | nindent 4 }}
rules:
  # Permissions to read certificate secrets created by cert-manager
  # and to create and update CA bundle Secret
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "patch", "update"]
  # get/patch scoped Routes. OpenShift requires create on routes/custom-host to
  # set TLS cert fields (e.g. externalCertificate); that SAR has no resource
  # name, so do not set resourceNames on the custom-host rule.
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    resourceNames: ["flightctl-ui", "flightctl-cli-artifacts-route"]
    verbs: ["get", "patch"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes/custom-host"]
    verbs: ["create"]

---
# RoleBinding to grant permissions to the ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flightctl-ca-bundle-creator
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "flightctl.standardLabels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: flightctl-ca-bundle-creator
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flightctl-ca-bundle-creator

{{- if and .Values.global.internalNamespace (ne .Values.global.internalNamespace .Release.Namespace) }}
---
# Role with permissions for CA bundle creation in internal namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flightctl-ca-bundle-creator
  namespace: {{ .Values.global.internalNamespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "flightctl.standardLabels" . | nindent 4 }}
rules:
  # Permissions to create and update CA secrets in internal namespace
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "patch", "update"]

---
# RoleBinding to grant permissions to the ServiceAccount in internal namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flightctl-ca-bundle-creator
  namespace: {{ .Values.global.internalNamespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "flightctl.standardLabels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: flightctl-ca-bundle-creator
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flightctl-ca-bundle-creator
{{- end }}
{{- end }}
