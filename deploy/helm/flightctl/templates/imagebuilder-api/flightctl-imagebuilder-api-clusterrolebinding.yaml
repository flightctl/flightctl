{{- if and .Values.imageBuilderApi .Values.imageBuilderApi.enabled }}
{{- $namespaceScoped := eq (include "flightctl.isNamespaceScoped" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ if $namespaceScoped }}RoleBinding{{ else }}ClusterRoleBinding{{ end }}
metadata:
  labels:
    {{- include "flightctl.standardLabels" . | nindent 4 }}
    flightctl.service: flightctl-imagebuilder-api
  name: flightctl-imagebuilder-api-{{ .Release.Namespace }}
  {{- if $namespaceScoped }}
  namespace: {{ include "flightctl.rbacNamespace" . }}
  {{- end }}
subjects:
  - kind: ServiceAccount
    name: flightctl-imagebuilder-api
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: {{ if $namespaceScoped }}Role{{ else }}ClusterRole{{ end }}
  name: flightctl-imagebuilder-api-{{ .Release.Namespace }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
