{{- if and (eq (include "flightctl.getEffectiveAuthType" .) "openshift") (ne (include "flightctl.isNamespaceScoped" .) "true") (ne (include "flightctl.isOpenShiftServiceAccountClient" .) "true") }}
apiVersion: oauth.openshift.io/v1
kind: OAuthClient
metadata:
  name: {{ include "flightctl.getOpenShiftOAuthClientId" . }}
  labels:
    {{- include "flightctl.standardLabels" . | nindent 4 }}
    flightctl.service: flightctl
    component: oauth-client
secret: {{ include "flightctl.getOpenShiftOAuthClientSecret" . | quote }}
redirectURIs:
  - "{{ include "flightctl.getUIUrl" . }}/callback"
  - http://localhost:8080/callback
grantMethod: auto
{{- end }}

