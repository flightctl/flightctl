{{- $effectiveAuthType := include "flightctl.getEffectiveAuthType" . }}
{{- if and .Values.alertmanagerProxy.enabled (or (eq $effectiveAuthType "k8s") (eq $effectiveAuthType "openshift")) }}
{{- $namespaceScoped := eq (include "flightctl.isNamespaceScoped" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ if $namespaceScoped }}Role{{ else }}ClusterRole{{ end }}
metadata:
  labels:
    {{- include "flightctl.standardLabels" . | nindent 4 }}
    flightctl.service: flightctl-alertmanager-proxy
  name: flightctl-alertmanager-proxy-{{ .Release.Namespace }}
  {{- if $namespaceScoped }}
  namespace: {{ include "flightctl.rbacNamespace" . }}
  {{- end }}
rules:
  {{- if not $namespaceScoped }}
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectaccessreviews"]
    verbs: ["create"]
  {{- end }}
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list"]
{{ end }}
