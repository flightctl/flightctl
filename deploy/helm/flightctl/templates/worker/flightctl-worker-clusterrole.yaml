{{ if .Values.worker.clusterLevelSecretAccess }}
{{- if eq (include "flightctl.isNamespaceScoped" .) "true" }}
{{- fail "worker.clusterLevelSecretAccess requires cluster-admin permissions and cannot be enabled when global.namespaceScoped=true" }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "flightctl.standardLabels" . | nindent 4 }}
    flightctl.service: flightctl-worker
  name: flightctl-worker-{{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
{{ end }}
