{{- include "flightctl-catalog-collector.validate" . -}}
{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
{{- if not (include "flightctl-catalog-collector.serviceEnabled" .) }}
{{- fail "flightctl-catalog-collector: metrics.serviceMonitor.enabled requires a Service carrying the metrics port; set service.enabled=true" }}
{{- end }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "flightctl-catalog-collector.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flightctl-catalog-collector.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "flightctl-catalog-collector.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: metrics
      path: {{ include "flightctl-catalog-collector.metricsPath" . }}
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
{{- end }}
