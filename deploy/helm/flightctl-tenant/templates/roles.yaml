{{- $flightctlNamespace := required "flightctlNamespace is required" .Values.flightctlNamespace }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flightctl-org-admin-{{ $flightctlNamespace }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flightctl-tenant.standardLabels" . | nindent 4 }}
rules:
  - verbs:
      - '*'
    apiGroups:
      - flightctl.io
    resources:
      - '*'

