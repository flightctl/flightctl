global:
  # The base domain for the deployment, from which the service FQDNs are derived.
  # If provided, must be a fully qualified domain name (FQDN) like "example.com" or a hostname that resolves via DNS.
  # If not provided, defaults to the system's hostname FQDN ('hostname -f').
  baseDomain:

  # Certificate generation method - 'none' or 'builtin'
  # - none: Do not generate certificates. User must provide certs in /etc/flightctl/pki/ or the service will fail to start.
  # - builtin: Generate a self-signed CA cert in /etc/flightctl/pki/ca.{crt,key}, unless the user already provided that CA.
  #            Generate the remaining certificates from the CA cert (default)
  generateCertificates: builtin
  auth:
    type: oidc # oidc, aap, oauth2, or none
    insecureSkipTlsVerify: true
    aap:
      enabled: true
      apiUrl:
      authorizationUrl:
      tokenUrl:
      clientId:
      clientSecret:
      token:
      appName:
      organizationId:
      # Optional prefix for org names from this provider (e.g. "aap-")
      organizationNamePrefix:
      scopes:
        - read
        - write
    oidc:
      clientId: flightctl-client
      clientSecret:  # Optional: Client secret for OIDC provider (injected by token proxy)
      enabled: true
      issuer:
      externalOidcAuthority:
      # scopes:
      #   - openid
      #   - profile
      #   - email
      #   - roles
      #   - offline_access
      organizationAssignment:
        type: dynamic
        claimPath:
          - organizations
      usernameClaim:
        - preferred_username
      roleAssignment:
        type: dynamic
        separator: ":"
        claimPath:
          - roles
    pamOidcIssuer:
      enabled: true
      # OIDC issuer URL - must include /api/v1/auth path. Leave empty to auto-configure as https://${global.baseDomain}:8444/api/v1/auth
      issuer:
      clientId: flightctl-client
      clientSecret:
      scopes:
        - openid
        - profile
        - email
        - roles
        - offline_access
      pamService: flightctl
  ui:
    # Whether flightctl-ui trusts X-Forwarded-* headers from trusted proxies.
    # Set to true when the UI sits behind a trusted reverse proxy or ingress (TLS termination).
    trustXForwardedHeaders: true
    # Optional comma-separated CIDRs of trusted proxy sources for forwarded headers.
    # Leave empty to keep default behavior.
    trustedProxyCidrs:

db:
  name: flightctl
  # To use external PostgreSQL database replace `builtin` with `external` and set an appropriate `external:` block
  type: "builtin"

remoteAccessService:
  # Enable or disable the remote access service.
  enabled: true
  logLevel: info
  # Rate limiting for the WebSocket console endpoint currently uses service.rateLimit below.

service:
  # Optional: TPM manufacturer / swtpm CA PEM paths for device enrollment (rendered into flightctl-api config).
  # Must be a YAML list, e.g.:
  # tpmCAPaths:
  #   - /etc/flightctl/tpm-cas/swtpm-localca-rootca-cert.pem
  #   - /etc/flightctl/tpm-cas/issuercert.pem
  # Rate limiting configuration (applied per-service where enabled).
  rateLimit:
    enabled: true
    requests: 300
    window: 1m
    authRequests: 20
    authWindow: 1h
    trustedProxies: []

grafana:
  oauth:
    enabled:
    authUrl:
    tokenUrl:
    apiUrl:
    scopes:
    clientId:
  localAdminUser:
  localAdminPassword:
  insecureSkipTlsVerify:
  protocol: https
  allowedUnsignedPlugins:

prometheus:

# Worker VM render options (optional). Uncomment to override defaults.
# Leave launcherImage unset to use the worker built-in default
# (quay.io/kubevirt/virt-launcher:v1.9.0). launcherImages selects by os-release
# ID and major from status.systemInfo (e.g. rhel + "9.5 (Plow)" -> "rhel-9").
# Other OS keys (fedora-42, ubuntu-24) are only used if you add them.
# In air-gapped environments, mirror virt-launcher and set these references
# to the mirrored location.
# Enable passtWorkarounds only when using older virt-launcher images that need it.
# worker:
#   vmRender:
#     launcherImage: ""
#     launcherImages:
#       "rhel-9": ""
#       "rhel-10": ""
#     passtWorkarounds: false

# ImageBuilder Worker (optional). Uncomment and set when using custom builder images, SBOM, or skip-TLS.
# imagebuilderWorker:
#   logLevel: info
#   maxConcurrentBuilds: 2
#   defaultTTL: 168h
#   rpmRepoUrl: ""
#   rpmRepoAdd: true
#   rpmRepoEnable: ""
#   dnfTimeout: 5
#   dnfRetries: 0
#   dnfSkipUnavailable: true
#   serviceImages:
#     podman:
#       image: ""           # Override Podman builder image (optional)
#       skipTlsVerify: false  # Set to true to skip TLS verification
#     bootcImageBuilder:
#       image: ""           # Override bootc-image-builder image (optional)
#       skipTlsVerify: false  # Set to true to skip TLS verification
#     syft:
#       image: ""           # Override Syft image for SBOM generation (optional)
#       skipTlsVerify: false
#   sbom:
#     enabled: true
#     pushToRegistry: true
#     uploadToTrustify: true
#     purlTransform:
#       enabled: true

# Vulnerability integration (optional). Uncomment and configure to enable.
# When enabled, flightctl-imagebuilder-worker also receives trustify settings (SBOM upload uses the same client as periodic).
# vulnerabilityReporting:
#   # Enable vulnerability integration (sync task in flightctl-periodic + API endpoints in flightctl-api).
#   enabled: false
#   # Sync interval for periodic backend fetch (e.g. "15m", "1h").
#   syncInterval: 15m
#   # Vulnerability scanning backend ('trustify' or 'quay'); leave empty to default to Trustify when a trustify config with a non-empty endpoint is present.
#   backend: trustify
#   trustify:
#     # Trustify API base URL (used by flightctl-periodic only).
#     # NOTE: Do not include the API path; the client appends /api/v2/vulnerability/analyze automatically.
#     endpoint: https://trustify.example.com
#     # Optional: CA certificate file for Trustify TLS (mount at /etc/ssl/trustify-ca.pem in container).
#     caFile: /etc/ssl/trustify-ca.pem
#     # Optional: Skip TLS verification (not recommended for production).
#     # skipTlsVerify: false
#     auth:
#       # Authentication mode. Allowed values: 'client-credentials', 'none'.
#       mode: none
#       # OIDC issuer URL (required when mode is 'client-credentials').
#       oidcIssuerUrl: https://keycloak.example.com/realms/trustify
#       # client_id and client_secret are supplied via FLIGHTCTL_VULNERABILITY_REPORTING_TRUSTIFY_CLIENT_ID
#       # and FLIGHTCTL_VULNERABILITY_REPORTING_TRUSTIFY_CLIENT_SECRET environment variables.
#     # Path to a CA bundle for verifying the Trustify server certificate. If unset, system roots are used.
#     # caFile: /etc/flightctl/certs/trustify-ca.pem
#     # Skip TLS certificate verification (insecure, for lab/air-gap only). Defaults to false.
#     # skipTlsVerify: false
#   # Quay backend (used by flightctl-periodic only). Set backend: quay above to select it.
#   quay:
#     # Quay API base URL (e.g. "https://quay.io").
#     endpoint: https://quay.io
#     # Maximum number of concurrent Quay API requests. Defaults to 5 when unset.
#     maxConcurrentRequests: 5
#     # The bearer token is supplied via the FLIGHTCTL_VULNERABILITY_REPORTING_QUAY_TOKEN environment variable.
#     # Path to a CA bundle for verifying the Quay server certificate. If unset, system roots are used.
#     # caFile: /etc/flightctl/certs/quay-ca.pem
#     # Skip TLS certificate verification (insecure, for lab/air-gap only). Defaults to false.
#     # skipTlsVerify: false

# Automated dependency synchronization (optional).
# Controls the global polling interval for git/HTTP dependency probes.
# dependenciesSync:
#   pollInterval: 15m

# Profiling (optional). Uncomment to enable loopback pprof and/or Pyroscope push
# for long-running services that load this shared config. See
# docs/user/installing/configuring-service-tracing.md.
# profiling:
#   pprof:
#     enabled: true
#     # port: 15691  # optional single-process override; omit for multi-service hosts
#   pyroscope:
#     enabled: true
#     serverAddress: http://pyroscope:4040
#     # applicationName: flightctl-worker
#     # basicAuthUser: ...
#     # basicAuthPassword: ...
#     # tenantID: ...

telemetryGateway:
  forward:
    endpoint:

userinfoProxy:
  upstreamUrl:
  insecureSkipTlsVerify:

gateway:
  suppressOldPorts: false

# Encryption-at-rest key configuration.
# The encryption key files live in /etc/flightctl/encryption/ and are mounted
# at /root/.flightctl/encryption/ inside each service container.
# For key rotation: write the new key under /etc/flightctl/encryption/ on the host,
# then list it here with path: /root/.flightctl/encryption/<filename> (container
# mount path, not host path), and change activeKeyID.
encryption:
  activeKeyID: default
  keys:
    - id: default
      path: /root/.flightctl/encryption/key
