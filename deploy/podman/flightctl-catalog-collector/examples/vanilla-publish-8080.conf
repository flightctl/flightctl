# Quadlet drop-in that publishes the HTTP snapshot source of
# examples/config-vanilla.yaml on the host loopback interface.
#
# The shipped unit only publishes the health (13133) and metrics (8888) ports,
# because a polling pipeline has no inbound listener. The vanilla example does
# have one, so its port has to be published explicitly before a POST from the
# host can reach it.
#
# Install it as a drop-in rather than editing the unit, so that upgrading the
# flightctl-catalog-collector package does not overwrite the change:
#
#   sudo mkdir -p /etc/containers/systemd/flightctl-catalog-collector.container.d
#   sudo cp /usr/share/flightctl/flightctl-catalog-collector/examples/vanilla-publish-8080.conf \
#           /etc/containers/systemd/flightctl-catalog-collector.container.d/
#   sudo systemctl daemon-reload
#   sudo systemctl restart flightctl-catalog-collector
#
# Then push a snapshot at it:
#
#   curl -sS -X POST http://127.0.0.1:8080/v1/snapshots \
#        -H 'Content-Type: application/json' \
#        -d '{"revision":"1","catalogs":[],"catalogItems":[]}'
#
# The HTTP source has no inbound authentication. Keep the host side of the
# mapping on 127.0.0.1; never publish it on a routable address.

[Container]
PublishPort=127.0.0.1:8080:8080
