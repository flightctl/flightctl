# Supply the Go RPMs required by the OpenSSL FIPS build dependency.
# The compiler itself is selected separately in site-defaults.cfg.
config_opts['dnf.conf'] += """

[flightctl-go-toolchain]
name=Red Hat Go toolchain
baseurl=https://cdn-ubi.redhat.com/content/public/ubi/dist/ubi$releasever/$releasever/$basearch/appstream/os/
enabled=1
includepkgs=golang*
"""
