# Canonical membership registry for Flight Control first-party and related images.
# Verified by: make verify-services (tools/verify-services).
# Profiles expand to the wiring checks; only rare overrides belong here.
version: 1

services:
  # --- backend-external ---
  # requireServiceAccount is opt-in: only list it when the service already ships a Helm SA.
  - name: api
    profile: backend-external
    requireServiceAccount: true

  - name: remote-access
    profile: backend-external
    requireServiceAccount: true

  - name: imagebuilder-api
    profile: backend-external
    helmValuesKey: imageBuilderApi
    requireServiceAccount: true
    # generate-certificates uses --imagebuilder-api-san (matches name)

  - name: telemetry-gateway
    profile: backend-external
    certSanFlag: telemetry

  - name: alertmanager-proxy
    profile: backend-external
    helmDir: alertmanager
    helmValuesKey: alertmanagerProxy
    requireServiceAccount: true

  # --- backend-internal ---
  - name: worker
    profile: backend-internal
    requireServiceAccount: true

  - name: periodic
    profile: backend-internal

  - name: imagebuilder-worker
    profile: backend-internal
    helmValuesKey: imageBuilderWorker
    requireServiceAccount: true

  - name: alert-exporter
    profile: backend-internal
    helmValuesKey: alertExporter

  # --- published images (not full backends) ---
  - name: cli-artifacts
    profile: image
    makeContainerTarget: multiarch-cli
    quadlet: true
    inFlightctlTarget: true
    inHelmChartOpts: true

  - name: db-setup
    profile: image
    inHelmChartOpts: true

  - name: pam-issuer
    profile: image
    quadlet: true
    inFlightctlTarget: false
    requireGateway: true
    needsTLS: true
    certSanFlag: pam-issuer

  - name: userinfo-proxy
    profile: image
    buildBinary: true
    quadlet: true
    inFlightctlTarget: false

  # --- images.yaml only ---
  - name: ui
    profile: images-yaml-only
    tagOverride: true

  - name: gateway
    profile: images-yaml-only

  - name: db
    profile: images-yaml-only
    collectLogs: true

  - name: kv
    profile: images-yaml-only
    collectLogs: true

  - name: alertmanager
    profile: images-yaml-only

  - name: grafana
    profile: images-yaml-only
    observabilityOnly: true

  - name: prometheus
    profile: images-yaml-only
    observabilityOnly: true
