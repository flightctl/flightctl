components:
  schemas:
    ApiVersion:
      type: string
      x-go-type: string
      description: APIVersion defines the versioned schema of this representation of an object.
      enum:
        - v1beta2
        - flightctl.io/v1beta2
        - ""
      x-enum-varnames:
        - ApiVersionV1beta2
        - ApiVersionFlightctlIoV1beta2
        - ApiVersionEmpty
    Device:
      type: object
      properties:
        apiVersion:
          $ref: '#/components/schemas/ApiVersion'
        kind:
          type: string
          description: Kind is a string value representing the REST resource this object represents.
        metadata:
          $ref: '../v1beta1/openapi.yaml#/components/schemas/ObjectMeta'
        spec:
          $ref: '../v1beta1/openapi.yaml#/components/schemas/DeviceSpec'
        status:
          $ref: '../v1beta1/openapi.yaml#/components/schemas/DeviceStatus'
      required:
        - apiVersion
        - kind
        - metadata
      additionalProperties: false
      description: Device represents a physical device.
    Fleet:
      type: object
      properties:
        apiVersion:
          $ref: '#/components/schemas/ApiVersion'
        kind:
          type: string
          description: Kind is a string value representing the REST resource this object represents.
        metadata:
          $ref: '../v1beta1/openapi.yaml#/components/schemas/ObjectMeta'
        spec:
          $ref: '../v1beta1/openapi.yaml#/components/schemas/FleetSpec'
        status:
          $ref: '../v1beta1/openapi.yaml#/components/schemas/FleetStatus'
      required:
        - apiVersion
        - kind
        - metadata
        - spec
      additionalProperties: false
      description: Fleet represents a set of devices.
    Status:
      type: object
      properties:
        apiVersion:
          $ref: '#/components/schemas/ApiVersion'
        kind:
          type: string
          description: Kind is a string value representing the REST resource this object represents.
        code:
          type: integer
          format: int32
          description: Suggested HTTP return code for this status, 0 if not set.
        message:
          type: string
          description: A human-readable description of the status of this operation.
        reason:
          type: string
          description: A machine-readable description of why this operation is in the Failure status.
        status:
          type: string
          description: Status of the operation. One of Success or Failure.
      description: Status is a return value for calls that don't return other objects.
      required:
        - apiVersion
        - kind
        - status
        - code
        - reason
        - message
