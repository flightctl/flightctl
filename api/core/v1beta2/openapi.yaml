    put:
      tags:
        - fleet
      description: Replace a Fleet resource. An omitted template firmware withdraws firmware management.
      operationId: replaceFleet
      parameters:
        - name: name
          in: path
          description: The name of the Fleet resource to update.
          required: true
          schema:
            type: string
      requestBody:
