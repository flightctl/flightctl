            type: string
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '../../core/v1beta1/openapi.yaml#/components/schemas/PatchRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '../../core/v1beta1/openapi.yaml#/components/schemas/Device'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '../../core/v1beta1/openapi.yaml#/components/schemas/Status'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../../core/v1beta1/openapi.yaml#/components/schemas/Status'
        "403":
          description: Forbidden
          content:
            application/json:
