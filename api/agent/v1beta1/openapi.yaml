components:
  schemas:
    FirmwarePolicy:
      type: object
      additionalProperties: false
      description: Private updater authorization view. The canonical document is bounded to 8 MiB before base64 encoding and its digest binds all retained evidence.
      required: [revision, digest, document]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Monotonic accepted catalog revision.
        digest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
          description: SHA-256 of the exact canonical document bytes.
        document:
          type: string
          format: byte
          minLength: 1
          maxLength: 11184812
          description: Base64-encoded firmware-policy/v1 canonical JSON, including revision, immutable descriptor bytes and retained tombstones. Contains no repository credentials.
    FirmwarePolicyReceipt:
      type: object
      additionalProperties: false
      description: Acknowledgement of a complete durably retained private authorization view.
      required: [revision, digest]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Durably accepted catalog revision.
        digest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
          description: Digest of the durably retained canonical document.
