- apiVersion: flightctl.io/v1beta1
  kind: LabelSyncMapping
  metadata:
    name: system-info
  spec:
    resourceType: Device
    expression: >-
      status.systemInfo.transformMapEntry(
        k,
        v,
        k in [
          "agentVersion",
          "architecture",
          "deltaEligible",
          "distroId",
          "distroVersion"
        ],
        {"feature.flightctl.io/systemInfo." + k: v}
      )
- apiVersion: flightctl.io/v1beta1
  kind: LabelSyncMapping
  metadata:
    name: custom-info
  spec:
    resourceType: Device
    expression: >-
      (has(status.systemInfo.customInfo) && status.systemInfo.customInfo != null
        ? status.systemInfo.customInfo
        : {}).transformMapEntry(
        k,
        v,
        {"feature.flightctl.io/customInfo." + k: v}
      )
- apiVersion: flightctl.io/v1beta1
  kind: LabelSyncMapping
  metadata:
    name: gpu-present
  spec:
    resourceType: Device
    expression: >-
      has(status.systemInfo.gpus) && status.systemInfo.gpus != null
        ? {
            "feature.flightctl.io/gpu.present":
              size(status.systemInfo.gpus) > 0 ? "true" : "false"
          }
        : {}
- apiVersion: flightctl.io/v1beta1
  kind: LabelSyncMapping
  metadata:
    name: kvm-enabled
  spec:
    resourceType: Device
    expression: >-
      has(status.systemInfo.kvm) && status.systemInfo.kvm != null
        && has(status.systemInfo.kvm.enabled) && status.systemInfo.kvm.enabled != null
        ? {
            "feature.flightctl.io/kvm.enabled":
              status.systemInfo.kvm.enabled ? "true" : "false"
          }
        : {}
- apiVersion: flightctl.io/v1beta1
  kind: LabelSyncMapping
  metadata:
    name: os-mode
  spec:
    resourceType: Device
    expression: >-
      has(status.systemInfo.osMode) && status.systemInfo.osMode != null
        ? {"feature.flightctl.io/os.mode": status.systemInfo.osMode}
        : {}
