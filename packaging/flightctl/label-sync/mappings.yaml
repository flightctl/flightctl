- apiVersion: flightctl.io/v1beta1
  kind: LabelSyncMapping
  metadata:
    name: system-info
  spec:
    resourceType: Device
    expression: >-
      status.systemInfo.transformMapEntry(
        k,
        v,
        k in [
          "agentVersion",
          "architecture",
          "deltaEligible",
          "distroId",
          "distroVersion"
        ],
        {"feature.flightctl.io/systemInfo." + k: v}
      )
- apiVersion: flightctl.io/v1beta1
  kind: LabelSyncMapping
  metadata:
    name: custom-info
  spec:
    resourceType: Device
    expression: >-
      (has(status.systemInfo.customInfo) && status.systemInfo.customInfo != null
        ? status.systemInfo.customInfo
        : {}).transformMapEntry(
        k,
        v,
        {"feature.flightctl.io/customInfo." + k: v}
      )
- apiVersion: flightctl.io/v1beta1
  kind: LabelSyncMapping
  metadata:
    name: gpu-present
  spec:
    resourceType: Device
    key: feature.flightctl.io/gpu.present
    expression: >-
      has(status.systemInfo.gpus) && status.systemInfo.gpus != null
        ? size(status.systemInfo.gpus) > 0
        : dyn(null)
- apiVersion: flightctl.io/v1beta1
  kind: LabelSyncMapping
  metadata:
    name: kvm-enabled
  spec:
    resourceType: Device
    key: feature.flightctl.io/kvm.enabled
    expression: >-
      has(status.systemInfo.kvm) && status.systemInfo.kvm != null
        && has(status.systemInfo.kvm.enabled) && status.systemInfo.kvm.enabled != null
        ? status.systemInfo.kvm.enabled
        : dyn(null)
- apiVersion: flightctl.io/v1beta1
  kind: LabelSyncMapping
  metadata:
    name: os-mode
  spec:
    resourceType: Device
    key: feature.flightctl.io/os.mode
    expression: status.systemInfo.osMode
