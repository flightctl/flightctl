packages:
  flightctl:
    specfile_path: packaging/rpm/flightctl.spec

    # add or remove files that should be synced
    files_to_sync:
      - packaging/rpm/flightctl.spec
      - .packit.yaml

    upstream_package_name: flightctl
    downstream_package_name: flightctl
    upstream_tag_template: v{version} # remove v from the start of the version tags (vx.y.z)->x.y.z
    enable_net: True # this is necessary for go modules to download the sources
    notifications:
      failure_comment:
        message: "/packit build"
actions:
  get-current-version:
    - bash -c './hack/current-version | sed "s/^v//; s/-/~/g"'
jobs:
  - job: copr_build
    trigger: pull_request
    targets:
      fedora-44-x86_64: {}
      epel-9-aarch64: {}
      # Keep the OpenSSL-backed toolchain expected by fips-validator.
      epel-10-aarch64: &epel10_go_toolchain
        additional_repos:
          - https://cdn-ubi.redhat.com/content/public/ubi/dist/ubi10/10/$basearch/appstream/os/
        with_opts:
          - go_1_26
    module_hotfixes: true

  - job: copr_build
    trigger: commit
    owner: "@redhat-et"
    project: flightctl-dev
    preserve_project: True
    targets:
      fedora-44-aarch64: {}
      fedora-44-x86_64: {}
      epel-9-aarch64: {}
      epel-9-x86_64: {}
      epel-10-aarch64: *epel10_go_toolchain
      epel-10-x86_64: *epel10_go_toolchain

  - job: copr_build
    trigger: release
    owner: "@redhat-et"
    project: flightctl
    preserve_project: True
    targets:
      fedora-44-aarch64: {}
      fedora-44-x86_64: {}
      epel-9-aarch64: {}
      epel-9-x86_64: {}
      epel-10-aarch64: *epel10_go_toolchain
      epel-10-x86_64: *epel10_go_toolchain
