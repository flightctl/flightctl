name: "Run E2E Tests"

on:
  workflow_call:
    inputs:
      os_id:
        description: "OS identifier for agent (e.g., cs9-bootc, cs10-bootc)"
        required: true
        type: string
      backend_type:
        description: "Backend deployment type (helm)"
        required: false
        type: string
        default: "helm"
      ginkgo_total_nodes:
        description: "Total number of Ginkgo nodes"
        required: false
        type: number
        default: 4
      ginkgo_label_filter:
        description: "Ginkgo label filter"
        required: false
        type: string
        default: "sanity"
      go_e2e_dirs:
        description: "Space-separated Go e2e package dirs passed to run_e2e_tests.sh"
        required: false
        type: string
        default: "./test/e2e/..."
      excluded_go_e2e_dirs:
        description: "Optional Go e2e package dirs to exclude after resolving go_e2e_dirs"
        required: false
        type: string
        default: ""
      tag:
        description: "Image tag"
        required: true
        type: string

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      nodes: ${{ steps.generate.outputs.nodes }}
    steps:
      - name: Generate node matrix
        id: generate
        env:
          GINKGO_TOTAL_NODES: ${{ inputs.ginkgo_total_nodes }}
        run: |
          nodes=$(seq 1 "${GINKGO_TOTAL_NODES}" | jq -R . | jq -s -c .)
          echo "nodes=${nodes}" >> "$GITHUB_OUTPUT"
          echo "Generated nodes matrix: ${nodes}"

  e2e-test:
    runs-on: flightctl-ci-runner
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix:
        ginkgo_node: ${{ fromJson(needs.generate-matrix.outputs.nodes) }}
    env:
      DOCKER_BUILDKIT: 1
      BUILDKIT_PROGRESS: plain
      FLIGHTCTL_NS: flightctl-external
    steps:
      # ========== PREPARE ENVIRONMENT ==========
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android >/dev/null 2>&1 &
          echo "Started background removal of /usr/local/lib/android (PID: $!)"
          df -h

      # ========== SETUP DEPENDENCIES ==========
      - name: Setup dependencies (KVM, libvirt, etc)
        uses: ./.github/actions/setup-dependencies
        with:
          setup_kvm: yes
          # Custom image (flightctl-ci-ubuntu-24) already has apt packages, KVM,
          # crun, protoc, and oras. Skipping avoids apt upgrades every job.
          skip_package_install: 'true'

      - name: Compute base domain
        id: base-domain
        run: |
          IP=$(ip route get 1.1.1.1 | grep -oP 'src \K\S+')
          echo "ip=${IP}" >> "$GITHUB_OUTPUT"
          echo "base_domain=${IP}.nip.io" >> "$GITHUB_OUTPUT"
          echo "Computed base domain: ${IP}.nip.io"

      # ========== DEPLOY BACKEND WITH HELM ==========
      - name: Deploy backend with Helm
        uses: ./.github/actions/deploy-backend-with-helm
        with:
          tag: ${{ inputs.tag }}
          base-domain: ${{ steps.base-domain.outputs.base_domain }}
          additional-values-files: deploy/helm/flightctl/values.e2e.yaml
          auth-type: k8s
          kind-config: test/scripts/kind_cluster.yaml
          display-summary: ${{ matrix.ginkgo_node == 1 }}
          wait: false

      # ========== DOWNLOAD E2E TEST ARTIFACTS ==========
      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: agent-*-${{ inputs.os_id }}-${{ inputs.tag }}
          path: test-artifacts
          merge-multiple: true

      - name: Download cs9-regular bundle for package-mode testcontainers
        if: ${{ inputs.os_id == 'cs9-bootc' }}
        uses: actions/download-artifact@v4
        with:
          name: agent-images-bundle-cs9-regular-${{ inputs.tag }}
          path: test-artifacts-cs9-regular

      - name: Stage test artifacts
        env:
          OS_ID: ${{ inputs.os_id }}
        run: |
          set -euo pipefail
          echo "Downloaded test artifacts:"
          tree test-artifacts

          # Stage agent bundle
          mkdir -p bin/agent-artifacts
          if [ ! -f "test-artifacts/agent-images-bundle-${OS_ID}.tar" ]; then
            echo "ERROR: Agent bundle not found"
            exit 1
          fi
          mv "test-artifacts/agent-images-bundle-${OS_ID}.tar" bin/agent-artifacts/
          echo "Agent bundle: bin/agent-artifacts/agent-images-bundle-${OS_ID}.tar"

          # Stage cs9-regular bundle for package-mode testcontainers (required on cs9-bootc)
          if [ "${OS_ID}" = "cs9-bootc" ]; then
            if [ ! -f "test-artifacts-cs9-regular/agent-images-bundle-cs9-regular.tar" ]; then
              echo "ERROR: cs9-regular agent bundle not found (required for package-mode e2e)"
              exit 1
            fi
            mv "test-artifacts-cs9-regular/agent-images-bundle-cs9-regular.tar" bin/agent-artifacts/
            echo "✓ Package-mode image bundle: bin/agent-artifacts/agent-images-bundle-cs9-regular.tar"
            rm -rf test-artifacts-cs9-regular
          fi

          # Stage the primary qcow2 used by prepare-e2e-qcow-config
          mkdir -p bin/output/qcow2
          if [ ! -f "test-artifacts/disk.qcow2" ]; then
            echo "ERROR: QCOW2 image not found"
            exit 1
          fi
          mv "test-artifacts/disk.qcow2" bin/output/qcow2/disk.qcow2
          echo "✓ QCOW2 image: bin/output/qcow2/disk.qcow2"

          # Cleanup
          rm -rf test-artifacts

          echo "Staged artifacts:"
          tree bin
          df -h

      - name: Load cs9-regular images for package-mode testcontainers
        if: ${{ inputs.os_id == 'cs9-bootc' }}
        run: |
          set -euo pipefail
          BUNDLE="bin/agent-artifacts/agent-images-bundle-cs9-regular.tar"
          if [ ! -f "${BUNDLE}" ]; then
            echo "ERROR: No cs9-regular bundle found at ${BUNDLE}"
            exit 1
          fi
          echo "Loading cs9-regular images for package-mode testcontainers..."
          # testcontainers-go uses Docker (not Podman) on GHA runners because
          # /var/run/docker.sock exists; load into the matching runtime.
          if [ -S /var/run/docker.sock ]; then
            docker load -i "${BUNDLE}"
            docker images | grep cs9-regular || true
          else
            podman load -i "${BUNDLE}"
            podman images | grep cs9-regular || true
          fi
          echo "✓ cs9-regular images loaded"

      # ========== PREP E2E ENV ==========
      - name: Wait for API readiness
        uses: ./.github/actions/wait-for-api-readiness
        with:
          base-domain: ${{ steps.base-domain.outputs.base_domain }}

      - name: Prepare E2E environment
        env:
          AGENT_OS_ID: ${{ inputs.os_id }}
        run: |
          # prepare-e2e-test handles the full dependency chain:
          #   - deploy-e2e-extras (registry)
          #   - build-e2e-containers
          #   - push-e2e-agent-images (detects existing bundles, won't rebuild)
          #   - prepare-e2e-qcow-config -> bin/.e2e-agent-injected -> bin/.e2e-agent-certs
          # All dependencies are resolved automatically by Make
          make prepare-e2e-test

      # ========== RUN E2E TESTS ==========
      - name: Restore Go cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Compute label filter hash
        id: compute-hash
        env:
          GINKGO_LABEL_FILTER: ${{ inputs.ginkgo_label_filter }}
          GO_E2E_DIRS: ${{ inputs.go_e2e_dirs }}
          EXCLUDED_GO_E2E_DIRS: ${{ inputs.excluded_go_e2e_dirs }}
        run: |
          HASH=$(printf '%s::%s::%s' "${GINKGO_LABEL_FILTER}" "${GO_E2E_DIRS}" "${EXCLUDED_GO_E2E_DIRS}" | sha256sum | cut -c1-8)
          echo "hash=${HASH}" >> "$GITHUB_OUTPUT"
          echo "Label filter: ${GINKGO_LABEL_FILTER}"
          echo "GO_E2E_DIRS: ${GO_E2E_DIRS}"
          echo "EXCLUDED_GO_E2E_DIRS: ${EXCLUDED_GO_E2E_DIRS}"
          echo "Hash: ${HASH}"

      - name: Resolve Go E2E dirs
        id: resolve-go-e2e-dirs
        uses: ./.github/actions/resolve-go-e2e-dirs
        with:
          go_e2e_dirs: ${{ inputs.go_e2e_dirs }}
          excluded_go_e2e_dirs: ${{ inputs.excluded_go_e2e_dirs }}

      - name: Download test discovery
        uses: actions/download-artifact@v4
        with:
          name: e2e-discovery-${{ steps.compute-hash.outputs.hash }}-${{ inputs.tag }}
          path: .

      - name: Check disk space
        run: df -h

      - name: Run E2E Test Slice
        env:
          GO_E2E_DIRS: ${{ steps.resolve-go-e2e-dirs.outputs.resolved_go_e2e_dirs }}
          GINKGO_LABEL_FILTER: ${{ inputs.ginkgo_label_filter }}
          GINKGO_TOTAL_NODES: ${{ inputs.ginkgo_total_nodes }}
          GINKGO_NODE: ${{ matrix.ginkgo_node }}
          # Continue remaining suites after the first failure so later-focused
          # specs (e.g. package-mode 90148 on a shard that also runs hooks) still execute.
          GINKGO_KEEP_GOING: "true"
          DISCOVERY_PATH: discovery.json
          ASSIGNMENTS_PATH: assignments.json
          RUNNER_DEBUG: ${{ runner.debug }}
        run: |
          set -euo pipefail

          if [[ "${RUNNER_DEBUG}" == "1" ]]; then
            echo "Debug mode enabled"
            export DEBUG_VM_CONSOLE=1
            export VERBOSE=true
          else
            echo "Debug mode disabled"
          fi

          make -e run-e2e-test

      - name: Check disk space after E2E tests
        if: always()
        run: df -h

      # ========== UPLOAD TEST RESULTS ==========
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results-${{ steps.compute-hash.outputs.hash }}-node-${{ matrix.ginkgo_node }}
          path: reports/junit_e2e_test.xml
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

      - name: Upload deployment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-logs-${{ steps.compute-hash.outputs.hash }}-node-${{ matrix.ginkgo_node }}
          path: artifacts/deployment-logs/
          if-no-files-found: ignore
          retention-days: 7

      # ========== COLLECT LOGS ==========
      - name: Collect and Upload Logs
        if: always()
        uses: ./.github/actions/collect-logs
        with:
          namespace-external: 'flightctl-external'
          namespace-internal: 'flightctl-internal'
          log-directory: 'e2e-logs-${{ steps.compute-hash.outputs.hash }}-node-${{ matrix.ginkgo_node }}-logs'
