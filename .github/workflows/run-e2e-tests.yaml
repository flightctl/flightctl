name: "Run E2E Tests"

on:
  workflow_call:
    inputs:
      os_id:
        description: "OS identifier for agent (e.g., cs9-bootc, cs10-bootc)"
        required: true
        type: string
      backend_type:
        description: "Backend deployment type (helm)"
        required: false
        type: string
        default: "helm"
      ginkgo_total_nodes:
        description: "Total number of Ginkgo nodes"
        required: false
        type: number
        default: 4
      ginkgo_label_filter:
        description: "Ginkgo label filter"
        required: false
        type: string
        default: "sanity"
      tag:
        description: "Image tag"
        required: true
        type: string

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      nodes: ${{ steps.generate.outputs.nodes }}
    steps:
      - name: Generate node matrix
        id: generate
        env:
          GINKGO_TOTAL_NODES: ${{ inputs.ginkgo_total_nodes }}
        run: |
          nodes=$(seq 1 "${GINKGO_TOTAL_NODES}" | jq -R . | jq -s -c .)
          echo "nodes=${nodes}" >> "$GITHUB_OUTPUT"
          echo "Generated nodes matrix: ${nodes}"

  e2e-test:
    runs-on: flightctl-ci-runner
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix:
        ginkgo_node: ${{ fromJson(needs.generate-matrix.outputs.nodes) }}
    env:
      DOCKER_BUILDKIT: 1
      BUILDKIT_PROGRESS: plain
      FLIGHTCTL_NS: flightctl-external
    steps:
      # ========== PREPARE ENVIRONMENT ==========
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android >/dev/null 2>&1 &
          echo "Started background removal of /usr/local/lib/android (PID: $!)"
          df -h

      # ========== SETUP DEPENDENCIES ==========
      - name: Setup dependencies (KVM, libvirt, etc)
        uses: ./.github/actions/setup-dependencies
        with:
          setup_kvm: yes
          # Custom image (flightctl-ci-ubuntu-24) already has apt packages, KVM,
          # crun, protoc, and oras. Skipping avoids apt upgrades every job.
          skip_package_install: 'true'

      - name: Compute base domain
        id: base-domain
        run: |
          IP=$(ip route get 1.1.1.1 | grep -oP 'src \K\S+')
          echo "ip=${IP}" >> "$GITHUB_OUTPUT"
          echo "base_domain=${IP}.nip.io" >> "$GITHUB_OUTPUT"
          echo "Computed base domain: ${IP}.nip.io"

      # ========== DEPLOY BACKEND WITH HELM ==========
      - name: Deploy backend with Helm
        uses: ./.github/actions/deploy-backend-with-helm
        with:
          tag: ${{ inputs.tag }}
          base-domain: ${{ steps.base-domain.outputs.base_domain }}
          additional-values-files: deploy/helm/flightctl/values.e2e.yaml
          auth-type: k8s
          kind-config: test/scripts/kind_cluster.yaml
          display-summary: ${{ matrix.ginkgo_node == 1 }}
          wait: false

      # ========== DOWNLOAD E2E TEST ARTIFACTS ==========
      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: agent-*-${{ inputs.os_id }}-${{ inputs.tag }}
          path: test-artifacts
          merge-multiple: true

      - name: Stage test artifacts
        env:
          OS_ID: ${{ inputs.os_id }}
        run: |
          set -euo pipefail
          echo "Downloaded test artifacts:"
          tree test-artifacts

          # Stage agent bundle
          mkdir -p bin/agent-artifacts
          if [ ! -f "test-artifacts/agent-images-bundle-${OS_ID}.tar" ]; then
            echo "ERROR: Agent bundle not found"
            exit 1
          fi
          mv "test-artifacts/agent-images-bundle-${OS_ID}.tar" bin/agent-artifacts/
          echo "Agent bundle: bin/agent-artifacts/agent-images-bundle-${OS_ID}.tar"

          # Stage qcow2
          mkdir -p bin/output/qcow2
          if [ ! -f "test-artifacts/disk.qcow2" ]; then
            echo "ERROR: QCOW2 image not found"
            exit 1
          fi
          mv "test-artifacts/disk.qcow2" bin/output/qcow2/disk.qcow2
          echo "✓ QCOW2 image: bin/output/qcow2/disk.qcow2"

          # Cleanup
          rm -rf test-artifacts

          echo "Staged artifacts:"
          tree bin
          df -h

      # ========== PREP E2E ENV ==========
      - name: Wait for API readiness
        uses: ./.github/actions/wait-for-api-readiness
        with:
          base-domain: ${{ steps.base-domain.outputs.base_domain }}

      - name: Prepare E2E environment
        env:
          AGENT_OS_ID: ${{ inputs.os_id }}
        run: |
          # prepare-e2e-test: certs, agent bundle sentinel, qcow inject, CLI.
          # Registry start + UploadImages run when the e2e process calls auxiliary.Get
          # (same Go path as make push-e2e-agent-images).
          make prepare-e2e-test

      # ========== RUN E2E TESTS ==========
      - name: Restore Go cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Compute label filter hash
        id: compute-hash
        env:
          GINKGO_LABEL_FILTER: ${{ inputs.ginkgo_label_filter }}
        run: |
          HASH=$(printf '%s' "${GINKGO_LABEL_FILTER}" | sha256sum | cut -c1-8)
          echo "hash=${HASH}" >> "$GITHUB_OUTPUT"
          echo "Label filter: ${GINKGO_LABEL_FILTER}"
          echo "Hash: ${HASH}"

      - name: Download test discovery
        uses: actions/download-artifact@v4
        with:
          name: e2e-discovery-${{ steps.compute-hash.outputs.hash }}-${{ inputs.tag }}
          path: .

      - name: Check disk space
        run: df -h

      - name: Run E2E Test Slice
        env:
          GINKGO_LABEL_FILTER: ${{ inputs.ginkgo_label_filter }}
          GINKGO_TOTAL_NODES: ${{ inputs.ginkgo_total_nodes }}
          GINKGO_NODE: ${{ matrix.ginkgo_node }}
          GINKGO_KEEP_GOING: "true"
          DISCOVERY_PATH: discovery.json
          ASSIGNMENTS_PATH: assignments.json
          RUNNER_DEBUG: ${{ runner.debug }}
          # The catalog collector suite installs the shipped collector chart
          # and needs the collector image from the build this run is testing.
          # That image is in the backend bundle "Deploy backend with Helm"
          # loaded into kind, under the tag "make build-containers" gives it
          # (OS=el9 in build-images-and-charts.yaml). It is never in this
          # runner's podman store, so the suite is told it is already in the
          # cluster and must not try to load it again.
          E2E_CATALOG_COLLECTOR_IMAGE: quay.io/flightctl/flightctl-catalog-collector-el9:${{ inputs.tag }}
          E2E_CATALOG_COLLECTOR_IMAGE_PRELOADED: "true"
          # Fail setup instead of skipping if that image ever stops shipping:
          # a silently skipped suite reports green while testing nothing.
          E2E_CATALOG_COLLECTOR_REQUIRED: "true"
        run: |
          set -euo pipefail
          if [[ "${RUNNER_DEBUG}" == "1" ]]; then
            echo "Debug mode enabled"
            export DEBUG_VM_CONSOLE=1
            export VERBOSE=true
          else
            echo "Debug mode disabled"
          fi
          make -e run-e2e-test

      # A suite that skips itself still shows up as a green, discovered suite.
      # The catalog collector smoke spec is the one that proves the shipped
      # chart and the built collector image actually work, so the node that
      # owns it asserts it ran instead of being skipped.
      - name: Verify the catalog collector smoke spec executed
        if: always()
        env:
          GINKGO_NODE: ${{ matrix.ginkgo_node }}
          # Must match the It text in test/e2e/catalogcollector.
          COLLECTOR_SPEC: "imports a LIVE model into a Flight Control catalog and catalog item"
          JUNIT_REPORT: reports/junit_e2e_test.xml
        run: |
          set -euo pipefail

          if [ ! -f assignments.json ]; then
            echo "No assignments.json on this node; nothing to verify."
            exit 0
          fi
          # Every node reports the specs it was not assigned as skipped, so
          # only the node that owns this spec can judge it. Entries are full
          # "Describe Context It" paths, hence the substring match.
          if ! jq -e --arg node "${GINKGO_NODE}" --arg spec "${COLLECTOR_SPEC}" \
                 'any((.[$node] // [])[]; contains($spec))' assignments.json >/dev/null; then
            echo "Node ${GINKGO_NODE} was not assigned the catalog collector smoke spec; nothing to verify."
            exit 0
          fi
          if [ ! -f "${JUNIT_REPORT}" ]; then
            echo "::warning::${JUNIT_REPORT} is missing; the test step failure above is the real error."
            exit 0
          fi

          python3 - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          spec = os.environ["COLLECTOR_SPEC"]
          report = os.environ["JUNIT_REPORT"]

          cases = [c for c in ET.parse(report).iter("testcase") if spec in (c.get("name") or "")]
          if not cases:
              sys.exit(f"::error::'{spec}' is absent from {report}: the suite did not run on this node.")

          for case in cases:
              skipped = case.find("skipped")
              if skipped is not None:
                  sys.exit(
                      f"::error::'{spec}' was skipped, not executed: "
                      f"{skipped.get('message') or 'no reason reported'}. "
                      "Discovering and skipping the catalog collector suite is not coverage."
                  )

          # A failing spec still executed; the test step above already failed
          # the job for it, so only a skip is reported here.
          print(f"'{spec}' executed ({len(cases)} case(s) in {report}).")
          PY

      - name: Check disk space after E2E tests
        if: always()
        run: df -h

      # ========== UPLOAD TEST RESULTS ==========
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results-${{ steps.compute-hash.outputs.hash }}-node-${{ matrix.ginkgo_node }}
          path: reports/junit_e2e_test.xml
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

      - name: Upload deployment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-logs-${{ steps.compute-hash.outputs.hash }}-node-${{ matrix.ginkgo_node }}
          path: artifacts/deployment-logs/
          if-no-files-found: ignore
          retention-days: 7

      # ========== COLLECT LOGS ==========
      - name: Collect and Upload Logs
        if: always()
        uses: ./.github/actions/collect-logs
        with:
          namespace-external: 'flightctl-external'
          namespace-internal: 'flightctl-internal'
          log-directory: 'e2e-logs-${{ steps.compute-hash.outputs.hash }}-node-${{ matrix.ginkgo_node }}-logs'
