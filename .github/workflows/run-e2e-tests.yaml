name: "Run E2E Tests"

on:
  workflow_call:
    inputs:
      os_id:
        description: "OS identifier for agent (e.g., cs9-bootc, cs10-bootc)"
        required: true
        type: string
      backend_type:
        description: "Backend deployment type (helm)"
        required: false
        type: string
        default: "helm"
      ginkgo_total_nodes:
        description: "Total number of Ginkgo nodes"
        required: false
        type: number
        default: 4
      ginkgo_label_filter:
        description: "Ginkgo label filter"
        required: false
        type: string
        default: "sanity"
      tag:
        description: "Image tag"
        required: true
        type: string

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      nodes: ${{ steps.generate.outputs.nodes }}
    steps:
      - name: Generate node matrix
        id: generate
        env:
          GINKGO_TOTAL_NODES: ${{ inputs.ginkgo_total_nodes }}
        run: |
          nodes=$(seq 1 "${GINKGO_TOTAL_NODES}" | jq -R . | jq -s -c .)
          echo "nodes=${nodes}" >> "$GITHUB_OUTPUT"
          echo "Generated nodes matrix: ${nodes}"

  e2e-test:
    runs-on: flightctl-ci-runner
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix:
        ginkgo_node: ${{ fromJson(needs.generate-matrix.outputs.nodes) }}
    env:
      DOCKER_BUILDKIT: 1
      BUILDKIT_PROGRESS: plain
      FLIGHTCTL_NS: flightctl-external
    steps:
      # ========== PREPARE ENVIRONMENT ==========
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android >/dev/null 2>&1 &
          echo "Started background removal of /usr/local/lib/android (PID: $!)"
          df -h

      # ========== SETUP DEPENDENCIES ==========
      - name: Setup dependencies (KVM, libvirt, etc)
        uses: ./.github/actions/setup-dependencies
        with:
          setup_kvm: yes

      - name: Compute base domain
        id: base-domain
        run: |
          IP=$(ip route get 1.1.1.1 | grep -oP 'src \K\S+')
          echo "ip=${IP}" >> "$GITHUB_OUTPUT"
          echo "base_domain=${IP}.nip.io" >> "$GITHUB_OUTPUT"
          echo "Computed base domain: ${IP}.nip.io"

      # ========== DOWNLOAD AGENT ARTIFACTS IN PARALLEL WITH DEPLOY ==========
      # Agent qcow/bundle download often rivals kind+Helm (~2–4m). Start it in a
      # detached process before deploy and join after so prep wall ≈
      # max(deploy, download) instead of sum. setsid survives the step shell exit.
      - name: Start agent artifact download
        env:
          OS_ID: ${{ inputs.os_id }}
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          rm -f /tmp/agent-artifact-download.done /tmp/agent-artifact-download.failed
          mkdir -p test-artifacts
          setsid bash -c '
            set -euo pipefail
            trap "touch /tmp/agent-artifact-download.failed" ERR
            gh run download "'"${RUN_ID}"'" \
              --repo "'"${REPO}"'" \
              --dir test-artifacts \
              --pattern "agent-*-'"${OS_ID}"'-'"${TAG}"'"
            bundle=$(find test-artifacts -type f -name "agent-images-bundle-'"${OS_ID}"'.tar" | head -n1)
            qcow=$(find test-artifacts -type f -name "disk.qcow2" | head -n1)
            test -n "${bundle}" && test -n "${qcow}"
            mkdir -p /tmp/agent-artifacts-flat
            mv "${bundle}" /tmp/agent-artifacts-flat/agent-images-bundle-'"${OS_ID}"'.tar
            mv "${qcow}" /tmp/agent-artifacts-flat/disk.qcow2
            rm -rf test-artifacts
            mv /tmp/agent-artifacts-flat test-artifacts
            touch /tmp/agent-artifact-download.done
          ' >/tmp/agent-artifact-download.log 2>&1 < /dev/null &
          echo "Started detached agent artifact download"

      # ========== DEPLOY BACKEND WITH HELM ==========
      - name: Deploy backend with Helm
        uses: ./.github/actions/deploy-backend-with-helm
        with:
          tag: ${{ inputs.tag }}
          base-domain: ${{ steps.base-domain.outputs.base_domain }}
          additional-values-files: deploy/helm/flightctl/values.e2e.yaml
          auth-type: k8s
          kind-config: test/scripts/kind_cluster.yaml
          display-summary: ${{ matrix.ginkgo_node == 1 }}
          wait: false

      - name: Stage test artifacts
        env:
          OS_ID: ${{ inputs.os_id }}
        run: |
          set -euo pipefail
          echo "Waiting for agent artifact download to finish..."
          for _ in $(seq 1 180); do
            if [[ -f /tmp/agent-artifact-download.done ]]; then
              break
            fi
            if [[ -f /tmp/agent-artifact-download.failed ]]; then
              echo "ERROR: agent artifact download failed"
              cat /tmp/agent-artifact-download.log || true
              exit 1
            fi
            sleep 2
          done
          if [[ ! -f /tmp/agent-artifact-download.done ]]; then
            echo "ERROR: agent artifact download timed out"
            cat /tmp/agent-artifact-download.log || true
            exit 1
          fi
          cat /tmp/agent-artifact-download.log || true
          echo "Downloaded test artifacts:"
          tree test-artifacts || ls -laR test-artifacts

          # Stage agent bundle
          mkdir -p bin/agent-artifacts
          if [ ! -f "test-artifacts/agent-images-bundle-${OS_ID}.tar" ]; then
            echo "ERROR: Agent bundle not found"
            find test-artifacts -type f -print || true
            exit 1
          fi
          mv "test-artifacts/agent-images-bundle-${OS_ID}.tar" bin/agent-artifacts/
          echo "Agent bundle: bin/agent-artifacts/agent-images-bundle-${OS_ID}.tar"

          # Stage qcow2
          mkdir -p bin/output/qcow2
          if [ ! -f "test-artifacts/disk.qcow2" ]; then
            echo "ERROR: QCOW2 image not found"
            find test-artifacts -type f -print || true
            exit 1
          fi
          mv "test-artifacts/disk.qcow2" bin/output/qcow2/
          echo "✓ QCOW2 image: bin/output/qcow2/disk.qcow2"

          # Cleanup
          rm -rf test-artifacts

          echo "Staged artifacts:"
          tree bin
          df -h

      # ========== PREP E2E ENV ==========
      - name: Wait for API readiness
        uses: ./.github/actions/wait-for-api-readiness
        with:
          base-domain: ${{ steps.base-domain.outputs.base_domain }}

      - name: Prepare E2E environment
        env:
          AGENT_OS_ID: ${{ inputs.os_id }}
        run: |
          # prepare-e2e-test handles the full dependency chain:
          #   - deploy-e2e-extras (registry)
          #   - build-e2e-containers
          #   - push-e2e-agent-images (detects existing bundles, won't rebuild)
          #   - prepare-e2e-qcow-config -> bin/.e2e-agent-injected -> bin/.e2e-agent-certs
          # All dependencies are resolved automatically by Make
          make prepare-e2e-test

      # ========== RUN E2E TESTS ==========
      - name: Restore Go cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Compute label filter hash
        id: compute-hash
        env:
          GINKGO_LABEL_FILTER: ${{ inputs.ginkgo_label_filter }}
        run: |
          HASH=$(printf '%s' "${GINKGO_LABEL_FILTER}" | sha256sum | cut -c1-8)
          echo "hash=${HASH}" >> "$GITHUB_OUTPUT"
          echo "Label filter: ${GINKGO_LABEL_FILTER}"
          echo "Hash: ${HASH}"

      - name: Download test discovery
        uses: actions/download-artifact@v4
        with:
          name: e2e-discovery-${{ steps.compute-hash.outputs.hash }}-${{ inputs.tag }}
          path: .

      - name: Check disk space
        run: df -h

      - name: Run E2E Test Slice
        env:
          GINKGO_LABEL_FILTER: ${{ inputs.ginkgo_label_filter }}
          GINKGO_TOTAL_NODES: ${{ inputs.ginkgo_total_nodes }}
          GINKGO_NODE: ${{ matrix.ginkgo_node }}
          DISCOVERY_PATH: discovery.json
          ASSIGNMENTS_PATH: assignments.json
          RUNNER_DEBUG: ${{ runner.debug }}
        run: |
          if [[ "${RUNNER_DEBUG}" == "1" ]]; then
            echo "Debug mode enabled"
            export DEBUG_VM_CONSOLE=1
            export VERBOSE=true
          else
            echo "Debug mode disabled"
          fi
          make -e run-e2e-test

      - name: Check disk space after E2E tests
        if: always()
        run: df -h

      # ========== UPLOAD TEST RESULTS ==========
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results-${{ steps.compute-hash.outputs.hash }}-node-${{ matrix.ginkgo_node }}
          path: reports/junit_e2e_test.xml
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

      - name: Upload deployment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-logs-${{ steps.compute-hash.outputs.hash }}-node-${{ matrix.ginkgo_node }}
          path: artifacts/deployment-logs/
          if-no-files-found: ignore
          retention-days: 7

      # ========== COLLECT LOGS ==========
      - name: Collect and Upload Logs
        if: always()
        uses: ./.github/actions/collect-logs
        with:
          namespace-external: 'flightctl-external'
          namespace-internal: 'flightctl-internal'
          log-directory: 'e2e-logs-${{ steps.compute-hash.outputs.hash }}-node-${{ matrix.ginkgo_node }}-logs'
