name: "Helm Chart Quality"

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release-*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-helm:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          since_last_remote_commit: 'true'
          # The Makefile holds the lint and render-test targets themselves, and
          # this workflow decides whether they run at all, so a change to either
          # has to trigger the job as surely as a change to a chart does.
          files: |
            deploy/helm/**
            Makefile
            .github/workflows/lint-helm.yaml

      - name: Running Helm Linter
        if: ${{ steps.changed-files.outputs.any_changed == 'true' }}
        shell: bash
        continue-on-error: false
        run: |
          set -euo pipefail
          make lint-helm

      # "helm lint" can only prove that a given value set renders. The render
      # tests assert the other half of the catalog collector chart's contract:
      # the value combinations that must *fail*, and the objects the ones that
      # succeed must produce.
      - name: Running catalog collector chart render tests
        if: ${{ steps.changed-files.outputs.any_changed == 'true' }}
        shell: bash
        continue-on-error: false
        run: |
          set -euo pipefail
          make test-helm-catalog-collector
