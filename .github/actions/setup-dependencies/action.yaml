---
name: 'Setup environment'
description: 'Setup CI environment for testing'
inputs:
  setup_kvm:
    description: 'Setup kvm in the VM'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
      # Pin cache-dependency-path to the root go.sum. Left unset, setup-go
      # resolves the cache key by searching for go.sum across the repo, and
      # this repo has several (root plus tools/*/go.sum). That ambiguous
      # resolution intermittently trips a runner-toolkit bug in setup-go's
      # post-step cache save ("Index was out of range"), which fails the job
      # even when all build/test steps pass. It surfaces on release branches
      # (cold cache -> the save path actually runs) far more than on main
      # (warm exact-key hit -> save skipped). Anchoring the key to a single
      # file that exists on every branch makes resolution deterministic while
      # keeping setup-go's built-in caching and its correct post-step save
      # timing (after go install and the caller's make targets complete).
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache-dependency-path: go.sum

      - name: Enable KVM group perms
        shell: bash
        if: inputs.setup_kvm != ''
        run: |
          echo "::group::Setting up KVM and virtualization tools"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt update -y 
          sudo apt install -y libvirt-clients libvirt-daemon-system libvirt-daemon \
                              virtinst bridge-utils qemu-system-x86 qemu-kvm \
                              swtpm apparmor-utils
          sudo usermod -a -G kvm,libvirt,swtpm $USER
          echo "::endgroup::"

      - name: Install dependencies
        shell: bash
        run: |
          echo "::group::Installing general dependencies"
          sudo apt update -y # fix broken repo cache
          sudo apt install -y make python3-pip podman podman-compose libvirt-dev libpam0g-dev

          # Prime rootless Podman API socket before Go testcontainers init() probes paths (otherwise
          # /var/run/docker.sock can win on runners that ship both Docker and Podman).
          podman info >/dev/null 2>&1 || true

          curl -Lo protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v3.14.0/protoc-3.14.0-linux-x86_64.zip"
          sudo unzip -q protoc.zip bin/protoc -d /usr/local
          sudo chmod a+x /usr/local/bin/protoc
          protoc --version
          rm -rf protoc.zip

          go install oras.land/oras/cmd/oras@v1.3.0
          oras version
          echo "::endgroup::"
      
      - name: Install bubblewrap for unit tests
        shell: bash
        if: ${{ inputs.unit_tests == 'true' }}
        run: |
          sudo apt install -y bubblewrap apparmor-profiles
          sudo ln -s /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap || true
          sudo apparmor_parser /etc/apparmor.d/bwrap

      - name: Fix container storage driver
        shell: bash
        run: |
          # Fix storage driver so it can be used with BIB (see https://github.com/osbuild/bootc-image-builder/issues/446)
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /etc/containers
          echo -e "[storage]\ndriver = \"overlay\"\nrunroot = \"/run/containers/storage\"\ngraphroot = \"/var/lib/containers/storage\"" | sudo tee /etc/containers/storage.conf
