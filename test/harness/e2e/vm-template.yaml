apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: {{.Name}}
spec:
  running: true
  template:
    spec:
      domain:
{{- if gt .CPUCores 0 }}
        cpu:
          cores: {{.CPUCores}}
{{- end }}
        devices:
          disks:
          - disk:
              bus: virtio
            name: containerdisk
          - disk:
              bus: virtio
            name: cloudinitdisk
          interfaces:
          - masquerade: {}
            name: default
          rng: {}
        memory:
          guest: {{.GuestMemory}}
        resources: {}
      networks:
      - name: default
        pod: {}
      volumes:
      - containerdisk:
          image: {{.Image}}
        name: containerdisk
{{- if .UserDataBase64 }}
      - cloudInitConfigDrive:
          userDataBase64: {{.UserDataBase64}}
        name: cloudinitdisk
{{- else }}
      - cloudInitNoCloud:
          userData: |-
{{ indent 12 .UserData }}
        name: cloudinitdisk
{{- end }}
