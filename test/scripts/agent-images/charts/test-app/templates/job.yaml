{{- if .Values.job.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-delta-job-{{ .Chart.Version }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      containers:
        - name: {{ .Chart.Name }}-job
          image: {{ .Values.job.image | quote }}
          imagePullPolicy: IfNotPresent
          {{- include "test-app.containerSecurityContext" . | nindent 10 }}
          command: ["sh", "-c", "echo job complete"]
{{- end }}
