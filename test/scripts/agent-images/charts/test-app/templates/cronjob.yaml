{{- if .Values.cronJob.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-delta-cronjob
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  schedule: "0 0 1 1 *"
  suspend: true
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Chart.Name }}
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          restartPolicy: Never
          containers:
            - name: {{ .Chart.Name }}-cronjob
              image: {{ .Values.cronJob.image | quote }}
              imagePullPolicy: IfNotPresent
              {{- include "test-app.containerSecurityContext" . | nindent 14 }}
              command: ["sh", "-c", "echo cron job image"]
{{- end }}
